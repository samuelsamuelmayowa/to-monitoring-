openapi: 3.1.0
info:
  title: T.O. Monitoring API
  version: 1.0.0-pilot
  summary: Personal-project management and allowlisted OpenTelemetry HTTP and database traces
  description: >-
    Personal project management and OTLP/HTTP JSON traces implemented in the existing Express backend.
    Deployment and reviewed Monitoring migrations are required before use. Existing T.O. login sessions are
    reused. Default ingestion accepts HTTP SERVER spans; enabled advanced tracing additionally accepts
    supported HTTP CLIENT and database CLIENT spans. MongoDB metadata is allowlisted, but integration
    readiness is documented separately in the developer guides. Team membership, protobuf, gRPC, metrics,
    and logs are planned and unavailable. Management and ingestion each allow 120 requests/IP/minute.
servers:
  - url: https://to-backendapi-v1-kctb.onrender.com
    description: Existing shared Render backend
  - url: http://localhost:8000
    description: Local shared backend
security: []
tags:
  - name: Projects
    description: Authenticated project management
  - name: Credentials
    description: Ingestion-only secrets; never expose to public React code
  - name: Telemetry
    description: Private project trace queries
  - name: OTLP
    description: Standard OpenTelemetry OTLP/HTTP JSON ingestion
paths:
  /api/monitoring/projects:
    get:
      tags:
        - Projects
      summary: List current user's projects
      security:
        - userSession: []
        - sessionCookie: []
      responses:
        '200':
          description: Projects belonging to the verified user
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  total:
                    type:
                      - integer
                      - 'null'
                    minimum: 0
                    description: >-
                      Exact count of projects owned by the verified user, independent of the 100-row list
                      limit.
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Returns up to 100 projects belonging to the verified Analytics account. Team sharing is not enabled.
    post:
      tags:
        - Projects
      summary: Register Node.js application
      security:
        - userSession: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - runtime
                - environment
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  example: Shopping API
                runtime:
                  type: string
                  enum:
                    - nodejs
                environment:
                  type: string
                  enum:
                    - development
                    - staging
                    - production
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/monitoring/projects/{id}/keys:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Credentials
      summary: List key metadata, never full secrets
      security:
        - userSession: []
        - sessionCookie: []
      responses:
        '200':
          description: Key records, without secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/KeyMetadata'
                  active_count:
                    type: integer
                    minimum: 0
                    description: Exact active-key count scoped to the authorized project.
                  max_active_keys:
                    type: integer
                    const: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: >-
        Returns all active metadata (maximum three) plus the 50 most recent records, deduplicated. Never
        returns hashes or old secrets.
    post:
      tags:
        - Credentials
      summary: Create send-only ingestion key (one-time secret)
      security:
        - userSession: []
        - sessionCookie: []
          csrfToken: []
      responses:
        '201':
          description: Secret returned ONCE, and only to authorized owner
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - key
                properties:
                  secret:
                    type: string
                    example: to_live_...SECRET_SHOWN_ONCE
                  key:
                    $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/monitoring/projects/{id}/keys/{keyId}:
    delete:
      tags:
        - Credentials
      summary: Revoke a project ingestion key
      security:
        - userSession: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/monitoring/projects/{id}/status:
    get:
      tags:
        - Telemetry
      summary: Check whether recent traces have arrived
      description: >-
        connected and http_active mean an eligible HTTP SERVER span was received within the last 10 minutes.
        has_received means retained HTTP SERVER data exists; it is not an all-time history guarantee.
        Database activity is separate and never marks HTTP connected. availability is always unknown.
        span_count counts retained HTTP SERVER spans, not database operations.
      security:
        - userSession: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Trace connection state
          content:
            application/json:
              schema:
                type: object
                required:
                  - connected
                  - has_received
                  - last_seen_at
                  - span_count
                properties:
                  connected:
                    type: boolean
                  has_received:
                    type: boolean
                  last_seen_at:
                    type:
                      - string
                      - 'null'
                    format: date-time
                  span_count:
                    type: integer
                    minimum: 0
                  http_last_seen_at:
                    type: [string, 'null']
                    format: date-time
                  http_active:
                    type: boolean
                  database_last_seen_at:
                    type: [string, 'null']
                    format: date-time
                    description: Most recent retained database CLIENT receipt, or null without advanced reads.
                  database_active:
                    type: boolean
                  telemetry_last_seen_at:
                    type: [string, 'null']
                    format: date-time
                    description: Project receipt timestamp; can include database activity.
                  availability:
                    type: string
                    const: unknown
                  activity_window_seconds:
                    type: integer
                    const: 600
                  retention_days:
                    type: integer
                    const: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/monitoring/projects/{id}/spans:
    get:
      tags:
        - Telemetry
      summary: Read latest HTTP server spans or an authorized project trace
      description: Advanced trace filtering requires the reviewed Phase 1 migration and server feature flag. Without trace_id, only HTTP server spans are returned.
      security:
        - userSession: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: trace_id
          description: Advanced mode only. Exact lowercase nonzero trace ID; always scoped to the owned project. Returns at most limit spans ordered by start time.
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
      responses:
        '200':
          description: Latest HTTP SERVER spans, or returned SERVER/CLIENT spans for an exact project-scoped trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  possibly_truncated:
                    type: boolean
                    description: Advanced mode only; true when the limit was reached. No complete-trace guarantee.
                  spans:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredSpan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/monitoring/projects/{id}/database-insights:
    get:
      tags: [Telemetry]
      summary: Bounded stored database-span statistics (feature-gated)
      description: >-
        Requires both advanced reads and MONITORING_DATABASE_INSIGHTS_ENABLED=true; otherwise 404.
        Computes backend statistics over the newest up to 1000 stored database CLIENT operations
        within the requested start-time range, independently of Trace Explorer. This is a bounded
        subset, not complete production metrics. Sampling, retention and response caps apply.
        Recorded error rate is a lower bound; unflagged outcomes are unknown. Review the proposed
        performance index before rollout. Percentiles use linear interpolation and small samples warn.
      security:
        - userSession: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: query
          name: hours
          schema: {type: integer, enum: [1, 24, 168], default: 24}
        - in: query
          name: threshold
          schema: {type: number, minimum: 1, maximum: 86400000, default: 500}
        - in: query
          name: system
          schema: {type: string, enum: [mysql, postgresql, sqlite, redis, mongodb]}
        - in: query
          name: service
          schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,99}$'}
      responses:
        '200':
          description: Bounded stored-operation statistics and hourly buckets; missing buckets are not zero latency
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DatabaseStatistics'
                  - type: object
                    properties:
                      start: {type: string, format: date-time}
                      end: {type: string, format: date-time}
                      threshold_ms: {type: number}
                      possibly_truncated: {type: boolean}
                      limit: {type: integer, const: 1000}
                      scope: {type: string}
                      trends:
                        type: array
                        maxItems: 169
                        items:
                          allOf:
                            - $ref: '#/components/schemas/DatabaseStatistics'
                            - type: object
                              properties:
                                at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /otlp/v1/traces:
    post:
      tags:
        - OTLP
      summary: Receive OTLP/HTTP-JSON traces from Node.js OpenTelemetry
      description: >-
        Send-only x-to-project-key required. Only eligible HTTP SERVER spans and whitelisted attributes are
        stored in default mode. With MONITORING_ADVANCED_TRACES_ENABLED=true and
        MONITORING_ADVANCED_TRACES_INGEST_ENABLED not false, eligible HTTP SERVER/CLIENT and database
        CLIENT spans are accepted using the reviewed advanced schema. Database systems mysql, postgresql,
        sqlite, redis and mongodb are allowlisted; this does not certify every driver integration.
        Names are synthesized from allowlisted operations; unsupported names become query. INTERNAL
        spans are excluded without rewriting parent IDs. SQL/query text, MongoDB contents, credentials,
        database/collection identifiers, raw messages, stacks, headers and arbitrary attributes are discarded.
        The recommended privacy preload also removes private fields before export.
        256 KB decompressed body, 100 input spans per request, 600 newly stored spans/project/minute,
        120 requests/IP/minute. Official SDK setup must set http/json and OTEL_BSP_MAX_EXPORT_BATCH_SIZE=100.
        Duplicate IDs are ignored. Key validation, quota, writes, and last-received update are transactional.
        Seven-day retention by received_at; pruning runs in bounded batches every minute while the backend
        is running, so expiry is asynchronous. Advanced spans must start within the last seven days,
        end no more than five minutes in the future, and last at most 24 hours. At most 10 resources,
        25 scopes per resource, 64 attributes per object and 16 events per span are accepted.
        HTTP SERVER receipt alone establishes HTTP connection state; startup database spans do not.
        Protobuf and gRPC are unavailable.
      security:
        - projectIngestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceSpans
              properties:
                resourceSpans:
                  type: array
                  description: OTLP ExportTraceServiceRequest resourceSpans in Protobuf JSON mapping
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Received eligible spans (HTTP server by default; allowlisted dependencies in enabled advanced mode)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example: {}
          headers:
            X-TO-Stored-Spans:
              description: New eligible spans persisted, including advanced database spans. Duplicates/excluded spans do not count; only stored HTTP SERVER spans establish HTTP activity.
              schema:
                type: integer
                minimum: 0
                maximum: 100
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /otlp/v1/logs:
    post:
      tags:
        - OTLP
      summary: OTLP logs (not available in v1)
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: OTLP log ingestion is not enabled
        '503':
          $ref: '#/components/responses/Unavailable'
  /otlp/v1/metrics:
    post:
      tags:
        - OTLP
      summary: OTLP metrics (not available in v1)
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: OTLP metric ingestion is not enabled
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    userSession:
      type: http
      scheme: bearer
      bearerFormat: VERIFIED_LOGIN_TOKEN
      description: Existing T.O. user authentication (verified by backend adapter); not an ingestion key.
    projectIngestKey:
      type: apiKey
      in: header
      name: x-to-project-key
    sessionCookie:
      type: apiKey
      in: cookie
      name: to_session
      description: >-
        HttpOnly cookie issued by existing Analytics login. Browser writes also require csrfToken from
        /api/session in X-CSRF-Token.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by existing /api/session; required for cookie-authenticated writes.
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid or missing credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Project not found or not owned by this user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict or too many active keys
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Too many spans or large body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Only OTLP/HTTP JSON is enabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Request rate or project ingestion quota reached; respect Retry-After
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Untrusted Origin or failed CSRF check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Supabase unavailable or reviewed Monitoring migrations missing; retry after Retry-After
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      anyOf:
        - required:
            - error
        - required:
            - message
    Project:
      type: object
      required:
        - id
        - name
        - runtime
        - environment
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Shopping API
        runtime:
          type: string
          const: nodejs
        environment:
          type: string
          enum:
            - development
            - staging
            - production
        created_at:
          type: string
          format: date-time
        ingest_url:
          type:
            - string
            - 'null'
          format: uri
          example: https://to-backendapi-v1-kctb.onrender.com/otlp/v1/traces
    KeyMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          example: to_live_aBcdEf12
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
    StoredSpan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        received_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        service_name:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        http_method:
          type:
            - string
            - 'null'
        http_route:
          type:
            - string
            - 'null'
        http_status:
          type:
            - integer
            - 'null'
        duration_ms:
          type:
            - number
            - 'null'
        span_error:
          type: boolean
          description: Recorded error flag. False does not establish success because explicit OK status is not retained.
        parent_span_id:
          type: [string, 'null']
          description: Advanced mode only; the parent may be excluded or sampled out.
        span_kind:
          type: string
          enum: [SERVER, CLIENT]
        span_name:
          type: [string, 'null']
          description: Synthesized safe operation label; legacy rows may be null.
        environment:
          type: [string, 'null']
          enum: [development, staging, production, test, null]
        service_version:
          type: [string, 'null']
          description: Numeric release version only.
        db_system:
          type: [string, 'null']
          enum: [mysql, postgresql, sqlite, redis, mongodb, null]
        db_operation:
          type: [string, 'null']
          description: Explicit current db.operation.name or legacy db.operation mapped to this allowlist, otherwise query. Never parsed from SQL or query contents.
          enum: [SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, BEGIN, COMMIT, ROLLBACK, GET, SET, DEL, FIND, FINDONE, AGGREGATE, COUNT, PING, EXECUTE, query, null]
        error_type:
          type: [string, 'null']
          description: Allowlisted error class or generic Error; no messages or stacks.
          enum: [Error, TypeError, RangeError, SyntaxError, ReferenceError, TimeoutError, AbortError, ECONNREFUSED, ECONNRESET, ETIMEDOUT, ENOTFOUND, timeout, null]
    DatabaseStatistics:
      type: object
      properties:
        count: {type: integer, minimum: 0, maximum: 1000}
        duration_sample_size: {type: integer, minimum: 0, maximum: 1000}
        average_ms: {type: [number, 'null']}
        p50_ms: {type: [number, 'null']}
        p95_ms: {type: [number, 'null']}
        p99_ms: {type: [number, 'null']}
        recorded_error_count: {type: integer, minimum: 0}
        recorded_error_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        unknown_outcome_count: {type: integer, minimum: 0}
        slow_count: {type: integer, minimum: 0}
        insufficient_data: {type: boolean}
